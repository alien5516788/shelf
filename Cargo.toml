[package]
name = "shelf"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
dotenv = "0.15.0"
iced = {version = "0.14.0", features = ["tokio"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "migrate", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }

[build-dependencies]
iced_lucide = "0.1.0"
